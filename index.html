<!doctype html>
<html lang="uk">
  <head>
    <script async src="https://www.googletagmanager.com/gtm.js?id=GTM-5WHZRGZL"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
</script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Темна ігрова бібліотека з улюбленими іграми та налаштуваннями."
    />
    <title>Game Space</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Бічна панель" data-i18n-aria="sidebar">
        <button class="profile" type="button" aria-label="Відкрити профіль" data-i18n-aria="openProfile">
          <span class="profile__avatar" aria-hidden="true">V</span>
          <span class="profile__name" data-i18n="profile">профіль</span>
          <span class="profile__chevron" aria-hidden="true">⌄</span>
        </button>

        <nav class="navigation" aria-label="Головна навігація" data-i18n-aria="navigation">
          <button class="navigation__item" type="button" data-page="home">
            <span class="navigation__icon" aria-hidden="true">⌂</span>
            <span data-i18n="navHome">Головна</span>
          </button>
          <button class="navigation__item" type="button" data-page="library">
            <span class="navigation__icon" aria-hidden="true">▦</span>
            <span data-i18n="navLibrary">Бібліотека</span>
          </button>
          <button class="navigation__item" type="button" data-page="wishlist">
            <span class="navigation__icon" aria-hidden="true">♡</span>
            <span data-i18n="navWishlist">Бажане</span>
          </button>
          <button class="navigation__item" type="button" data-page="new">
            <span class="navigation__icon" aria-hidden="true">✦</span>
            <span data-i18n="navNew">Новинки</span>
          </button>
          <button class="navigation__item" type="button" data-page="settings">
            <span class="navigation__icon" aria-hidden="true">⚙</span>
            <span data-i18n="navSettings">Налаштування</span>
          </button>
        </nav>

        <div class="sidebar__footer">
          <span class="status-dot" aria-hidden="true"></span>
          <span data-i18n="status">Усі системи працюють</span>
        </div>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <a class="brand" href="#" aria-label="Game Space — головна" data-i18n-aria="brandLabel">
            <span class="brand__mark" aria-hidden="true">G</span>
            <span>GAME SPACE</span>
          </a>
          <label class="search">
            <span class="search__icon" aria-hidden="true">⌕</span>
            <span class="sr-only" data-i18n="searchLabel">Пошук ігор</span>
            <input id="game-search" type="search" placeholder="Пошук ігор..." data-i18n-placeholder="searchPlaceholder" autocomplete="off" />
            <kbd>⌘ K</kbd>
          </label>
          <button class="icon-button topbar__notifications" type="button" aria-label="Сповіщення" data-i18n-aria="notifications">
            ♧
            <span class="notification-dot" aria-hidden="true"></span>
          </button>
        </header>

        <section id="page-content" class="page-content" aria-live="polite"></section>
      </main>
    </div>

    <dialog class="game-dialog" id="game-dialog">
      <button class="game-dialog__close icon-button" type="button" aria-label="Закрити" data-i18n-aria="close">×</button>
      <div class="game-dialog__art game-art" id="dialog-art"></div>
      <div class="game-dialog__content">
        <p class="eyebrow" data-i18n="dialogEyebrow">ІНФОРМАЦІЯ ПРО ГРУ</p>
        <h2 id="dialog-title"></h2>
        <p id="dialog-description"></p>
        <button class="button button--primary" type="button" id="dialog-action" data-i18n="libraryAction">До бібліотеки</button>
      </div>
    </dialog>
  </body>
</html>
